services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lad
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lad_password}
      POSTGRES_DB: login_anomaly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lad -d login_anomaly"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Không mở cổng ra ngoài. Chỉ backend trong cùng mạng truy cập được.
    expose:
      - "5432"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://lad:${DB_PASSWORD:-lad_password}@db:5432/login_anomaly
      LAD_API_KEY: ${LAD_API_KEY:-demo-api-key-doi-truoc-khi-nop}
    volumes:
      # Gắn thư mục frontend để sửa giao diện không phải dựng lại image
      - ./frontend:/frontend:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
